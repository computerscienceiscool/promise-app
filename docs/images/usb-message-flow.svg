<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Promise App USB message flow</title>
  <desc id="description">A phone signs and stores a message, uploads it through a USB ADB tunnel to a relay on the computer, then the computer recipient fetches and verifies the same immutable bytes.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#176b52"/></marker>
    <style>
      .title { font: 700 32px system-ui, sans-serif; fill: #10231d; }
      .label { font: 700 20px system-ui, sans-serif; fill: #10231d; }
      .text { font: 16px system-ui, sans-serif; fill: #243630; }
      .small { font: 14px system-ui, sans-serif; fill: #35534a; }
      .box { stroke: #176b52; stroke-width: 3; rx: 18; }
      .arrow { stroke: #176b52; stroke-width: 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#f5faf7"/>
  <text x="60" y="58" class="title">What happens when the phone sends a PromiseGrid POC message</text>

  <rect x="55" y="145" width="220" height="285" class="box" fill="#dff5ec"/>
  <text x="85" y="190" class="label">1. Phone</text>
  <text x="85" y="224" class="text">Creates device identity</text>
  <text x="85" y="252" class="text">Signs message</text>
  <text x="85" y="280" class="text">Saves exact bytes</text>
  <text x="85" y="308" class="text">in durable outbox</text>
  <text x="85" y="356" class="small">Phone sends to:</text>
  <text x="85" y="382" class="small">127.0.0.1:8080</text>

  <path d="M280 287 H410" class="arrow"/>
  <text x="302" y="252" class="label">2. USB cable</text>
  <text x="302" y="318" class="small">ADB reverse tunnel</text>
  <text x="302" y="342" class="small">No Wi-Fi needed</text>

  <rect x="425" y="145" width="250" height="285" class="box" fill="#e7efff"/>
  <text x="455" y="190" class="label">3. Computer relay</text>
  <text x="455" y="224" class="text">Receives exact bytes</text>
  <text x="455" y="252" class="text">Checks message CID</text>
  <text x="455" y="280" class="text">Stores bytes + audit</text>
  <text x="455" y="308" class="text">Routes by recipient CID</text>
  <text x="455" y="356" class="small">It does NOT accept</text>
  <text x="455" y="380" class="small">or alter the promise.</text>

  <path d="M680 287 H810" class="arrow"/>
  <text x="705" y="252" class="label">4. Fetch</text>
  <text x="705" y="318" class="small">Same immutable</text>
  <text x="705" y="342" class="small">message bytes</text>

  <rect x="825" y="145" width="320" height="285" class="box" fill="#fff3d9"/>
  <text x="855" y="190" class="label">5. Computer recipient</text>
  <text x="855" y="224" class="text">Fetches envelope</text>
  <text x="855" y="252" class="text">Recomputes CID</text>
  <text x="855" y="280" class="text">Verifies pCID + signature</text>
  <text x="855" y="308" class="text">Checks intended recipient</text>
  <text x="855" y="356" class="small">Retains verified CBOR</text>
  <text x="855" y="380" class="small">as candidate evidence.</text>

  <rect x="55" y="490" width="1090" height="78" rx="14" fill="#10231d"/>
  <text x="90" y="524" style="font:700 18px system-ui,sans-serif;fill:#fff">What was proved:</text>
  <text x="90" y="550" style="font:16px system-ui,sans-serif;fill:#fff">One real phone signed, queued, and uploaded an immutable message; the computer independently verified and retained the same bytes.</text>
</svg>
